<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header>
            <h1 class="title">TIC <span class="accent-text">TAC</span> TOE</h1>
            <div class="status-display" id="status">Player <span class="x-color">X</span>'s turn</div>
        </header>

        <div class="game-board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="scoreboard">
            <div class="score-card x-score">
                <span class="label">Player X</span>
                <span class="score" id="score-x">0</span>
            </div>
            <div class="score-card ties">
                <span class="label">Ties</span>
                <span class="score" id="score-ties">0</span>
            </div>
            <div class="score-card o-score">
                <span class="label">Player O</span>
                <span class="score" id="score-o">0</span>
            </div>
        </div>

        <button id="restart-btn" class="restart-btn">Restart Game</button>
    </div>

    <!-- Winning Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-message">Player X Wins!</h2>
            <button id="modal-btn" class="restart-btn">Play Again</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
